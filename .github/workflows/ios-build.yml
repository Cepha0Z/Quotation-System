name: Build iOS App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Install CocoaPods
        run: |
          sudo gem install cocoapods

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Build iOS
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package app
        run: |
          mkdir -p artifact
          cp -R build/Build/Products/Debug-iphoneos/App.app artifact/

      - name: Upload iOS app
        uses: actions/upload-artifact@v4
        with:
          name: quotation-system-ios
          path: artifact/App.app